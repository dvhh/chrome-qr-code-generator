<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    :root {
      --bg-color: #ffffff;
      --text-color: #333333;
      --input-bg: #ffffff;
      --input-border: #cccccc;
      --canvas-border: #eeeeee;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg-color: #1e1e1e;
        --text-color: #f5f5f5;
        --input-bg: #2d2d2d;
        --input-border: #444444;
        --canvas-border: #333333;
      }
    }
    body {
      font-family: system-ui, sans-serif;
      width: 260px;
      margin: 0;
      padding: 16px;
      background: var(--bg-color);
      color: var(--text-color);
      text-align: center;
    }
    canvas {
      background: var(--bg-color);
    }
    h3 { margin-top: 0; font-size: 16px; }
    input {
      width: 100%;
      padding: 8px;
      margin-bottom: 14px;
      border: 1px solid var(--input-border);
      background: var(--input-bg);
      color: var(--text-color);
      border-radius: 6px;
      box-sizing: border-box;
      outline: none;
    }
    input:focus { border-color: #007acc; }
    .canvas-container {
      background: #ffffff; /* Must remain white for phone cameras to scan */
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--canvas-border);
      display: inline-block;
    }
    canvas { display: block; max-width: 100%; }
  </style>
</head>
<body>
  <div class="canvas-container">
    <canvas id="qr-canvas"></canvas>
  </div>
  <script src="qrious.min.js"></script>
  <script src="popup.js"></script>
</body>
</html>
