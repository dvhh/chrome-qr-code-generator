<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>QR code for this page</title>
  <style>
    :root {
      --bg-color: #ffffff;
      --text-color: #333333;
      --canvas-border: #eeeeee;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg-color: #1e1e1e;
        --text-color: #f5f5f5;
        --canvas-border: #333333;
      }
    }
    body {
      font-family: system-ui, sans-serif;
      width: 260px;
      margin: 0;
      padding: 16px;
      background: var(--bg-color);
      color: var(--text-color);
      text-align: center;
    }
    .canvas-container {
      background: #ffffff; /* Must remain white for phone cameras to scan */
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--canvas-border);
      display: inline-block;
    }
    .canvas-container[hidden] { display: none; }
    canvas { display: block; max-width: 100%; }
    #status { margin: 0; font-size: 14px; }
  </style>
</head>
<body>
  <div class="canvas-container" hidden>
    <canvas id="qr-canvas" role="img" aria-label="QR code for the current page"></canvas>
  </div>
  <p id="status" role="status" hidden></p>
  <script src="qrious.min.js"></script>
  <script src="popup.js"></script>
</body>
</html>
